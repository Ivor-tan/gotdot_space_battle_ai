plugins {
    id "com.android.library"
}

android {
    namespace "com.ivortan.godot_taptap_ad"
    compileSdk 36

    defaultConfig {
        minSdk 21
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files("../../../android/build/libs/debug/godot-lib.template_debug.aar")
    compileOnly files("../libs/dirichlet_ad_5.3.0.1.aar")
}

tasks.register("copyPluginAars", Copy) {
    dependsOn("assembleDebug", "assembleRelease")
    from("build/outputs/aar")
    into("../bin")
    eachFile { details ->
        if (details.name.endsWith("-debug.aar")) {
            details.path = "debug/GodotTapTapAdSDK-debug.aar"
        } else if (details.name.endsWith("-release.aar")) {
            details.path = "release/GodotTapTapAdSDK-release.aar"
        }
    }
    includeEmptyDirs = false
}
